name: Automated Data Preprocessing

on:
  push:
    branches: [main]
    paths:
      - 'preprocessing/automate_Irsyad_Adfiansha_Hidayat.py'
      - '.github/workflows/preprocessing.yml'
  schedule:
    - cron: '0 0 * * 0'  # Weekly trigger
  workflow_dispatch:

jobs:
  preprocess:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn kagglehub
    
    - name: Run preprocessing pipeline
      run: |
        cd preprocessing
        python automate_Irsyad_Adfiansha_Hidayat.py
    
    - name: Commit and push preprocessed data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add preprocessing/heart_disease_preprocessed/
        git commit -m "Auto: Updated preprocessed dataset" || true
        git push
    
    - name: Upload preprocessed data as artifact
      uses: actions/upload-artifact@v3
      with:
        name: preprocessed-data
        path: preprocessing/heart_disease_preprocessed/